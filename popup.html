<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Font Presets</h1>
    <button id="add" class="primary">+ New</button>
  </header>

  <div id="status" hidden></div>

  <ul id="list"></ul>

  <form id="editor" hidden>
    <h2 id="editor-title">New preset</h2>
    <label>Name <input name="name" required maxlength="30"></label>
    <label>Font <input name="font" list="fonts" placeholder="Arial"></label>
    <datalist id="fonts">
      <option>Arial</option><option>Calibri</option><option>Cambria</option><option>Comic Sans MS</option>
      <option>Courier New</option><option>Georgia</option><option>Lato</option><option>Lora</option>
      <option>Merriweather</option><option>Montserrat</option><option>Open Sans</option><option>Roboto</option>
      <option>Roboto Mono</option><option>Times New Roman</option><option>Trebuchet MS</option><option>Verdana</option>
    </datalist>
    <div class="row">
      <label>Size <input name="size" type="number" min="1" max="400" step="0.5" placeholder="11"></label>
      <label>Color <input name="color" type="color" value="#000000"></label>
    </div>
    <div class="row toggles">
      <label class="tog"><input type="checkbox" name="bold"><b>B</b></label>
      <label class="tog"><input type="checkbox" name="italic"><i>I</i></label>
      <label class="tog"><input type="checkbox" name="underline"><u>U</u></label>
    </div>
    <div class="row actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>

  <footer>
    <a href="#" id="shortcuts">Change keyboard shortcuts</a>
  </footer>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
